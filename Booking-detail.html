                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div
                                                    class="right d-flex flex-column gap-2 align-items-md-end justify-content-md-end">

                                                    <p>2h 28m</p>

                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="end-card pt-4">

                            <div class="pay">
                                <div class="card shadow p-3">
                                    <form>
                                        <div class="pay-full d-flex justify-content-between">
                                            <label for="full" class="d-flex flex-column gap-1">
                                                <div class="inside-label d-flex flex-column gap-2">
                                                    <h1 class="fs-5">Pay in full</h1>
                                                    <p>Pay the total and you are all set</p>
                                                </div>
                                            </label>
                                            <input type="radio" name="pay" value="full" id="full">
                                        </div>
                                        <div class="pay-part d-flex justify-content-between">
                                            <label for="part" class="d-flex flex-column gap-1">
                                                <div class="inside-label d-flex flex-column gap-2">
                                                    <h1 class="fs-5">Pay part now, part later</h1>
                                                    <p class="fs-14">Pay $207.43 now, and the rest ($207.43) will be
                                                        automatically charged
                                                        to
                                                        the same payment method on Nov 14, 2022. No extra fees.
                                                    </p>
                                                    <a class="second-color text-decoration-underline fs-12"
                                                        href="#">More info</a>
                                                </div>
                                            </label>
                                            <input type="radio" name="pay" value="part" id="part">
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <div class="login"></div>
                        </div>
                    </div>
                    <div class="col-md-4"></div>
