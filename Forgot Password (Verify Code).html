<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code</title>
    <meta name="description"
        content="Secure account verification - Input the authentication code from your email to confirm your identity and continue with the password recovery process.">
    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/Verify-Code.css">

<body>
    <main>

                <div class="row g-3">
                    <div class="col-md-5">

                        <div class="register d-flex flex-column gap-4">
                            <div class="d-flex flex-column gap-2">
                                <div class="d-flex gap-2">
                                    <a href="./Signup.html"><svg xmlns="http://www.w3.org/2000/svg" height="20"
                                            width="20"
                                            viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                                            <path fill="#0b160b"

                                <p class="light-secondary-color m-0">An authentication code has been sent to your email.
                                </p>

                                <div class="d-flex position-relative">
                                    <label class="position-absolute bg-white p-1 fs-12 light-secondary-color">Enter

                                    <input type="email" placeholder="7789BM6X"
                                        class="fs-12 light-secondary-color ps-2 py-3 rounded-2 border-1 w-100">
                                    <svg class="position-absolute hide" xmlns="http://www.w3.org/2000/svg" height="20"
                                        width="20"
                                        viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                                        <path fill="#0b160b"

                                </div>
                                <p class="m-0 pt-2 fs-12 light-secondary-color">Didn’t receive a code? <a href=""
                                        class="salmon-color">Resend</a> </p>
                            </form>

                            <a href="./Set-new-Password.html"
                                class="btn btn-primary w-100 rounded-1 fs-14 py-2 fw-semibold">Verify</a>


                        </div>
                    </div>
                    <div class="col-md-6 offset-md-1">
                        <div id="carouselExampleIndicators" class="carousel slide">
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                                    class="active" aria-current="true" aria-label="Slide 1"></button>
                                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                                    aria-label="Slide 2"></button>
                                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                                    aria-label="Slide 3"></button>
                            </div>
                            <div class="carousel-inner rounded-4">
                                <div class="carousel-item active">
                                    <img src="./assets/img/login/Bali.jpg" class="d-block w-100" alt="...">
                                </div>
                                <div class="carousel-item">
                                    <img src="./assets/img/login/airplain.jpg" class="d-block w-100" alt="...">
                                </div>
                                <div class="carousel-item">
                                    <img src="./assets/img/login/hotel.jpg" class="d-block w-100" alt="...">
                                </div>
                            </div>
                            <button class="carousel-control-prev" type="button"
                                data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">

                            </button>
                            <button class="carousel-control-next" type="button"
                                data-bs-target="#carouselExampleIndicators" data-bs-slide="next">

                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
