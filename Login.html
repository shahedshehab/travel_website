<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <!--bootstrap 5.3-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--my css file-->
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/login.css">
</head>

<body>
    <!-- login section -->
    <main>
        <section class="Login py-5">
            <div class="container">
                <div class="row g-3">
                    <div class="col-md-5">
                        <img src="./assets/img/flights_search-page/navbar/Logo.png" class="mb-5" alt="Logo">
                        <div class="register d-flex flex-column gap-4">
                            <div class="d-flex flex-column gap-2">
                                <h1 class="fw-semibold fs-1 special-font">Login</h1>
                                <p class="light-secondary-color m-0">Login to access your Golobe account</p>
                            </div>
                            <form>
                                <div class="d-flex flex-column gap-3">
                                    <div class="d-flex position-relative">
                                        <label
                                            class="position-absolute bg-white p-1 fs-12 light-secondary-color">Email</label>
                                        <input type="email" placeholder="john.doe@gmail.com"
                                            class="fs-12 light-secondary-color ps-2 py-3 rounded-2 border-1 w-100">
                                    </div>
                                    <div class="d-flex position-relative">
                                        <label
                                            class="position-absolute bg-white p-1 fs-12 light-secondary-color">Password</label>
                                        <input type="email" placeholder="•••••••••••••••••••••••••"
                                            class="fs-12 light-secondary-color ps-2 py-3 rounded-2 border-1 w-100">
                                        <svg class="position-absolute hide" xmlns="http://www.w3.org/2000/svg"
                                            height="20" width="20"
                                            viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                                            <path fill="#0b160b"
                                                d="M73 39.1C63.6 29.7 48.4 29.7 39.1 39.1C29.8 48.5 29.7 63.7 39 73.1L567 601.1C576.4 610.5 591.6 610.5 600.9 601.1C610.2 591.7 610.3 576.5 600.9 567.2L504.5 470.8C507.2 468.4 509.9 466 512.5 463.6C559.3 420.1 590.6 368.2 605.5 332.5C608.8 324.6 608.8 315.8 605.5 307.9C590.6 272.2 559.3 220.2 512.5 176.8C465.4 133.1 400.7 96.2 319.9 96.2C263.1 96.2 214.3 114.4 173.9 140.4L73 39.1zM236.5 202.7C260 185.9 288.9 176 320 176C399.5 176 464 240.5 464 320C464 351.1 454.1 379.9 437.3 403.5L402.6 368.8C415.3 347.4 419.6 321.1 412.7 295.1C399 243.9 346.3 213.5 295.1 227.2C286.5 229.5 278.4 232.9 271.1 237.2L236.4 202.5zM357.3 459.1C345.4 462.3 332.9 464 320 464C240.5 464 176 399.5 176 320C176 307.1 177.7 294.6 180.9 282.7L101.4 203.2C68.8 240 46.4 279 34.5 307.7C31.2 315.6 31.2 324.4 34.5 332.3C49.4 368 80.7 420 127.5 463.4C174.6 507.1 239.3 544 320.1 544C357.4 544 391.3 536.1 421.6 523.4L357.4 459.2z" />
                                        </svg>
                                    </div>
                                    <div class="password-status d-flex justify-content-between">
                                        <div class="d-flex gap-2">
                                            <input type="checkbox" id="remember">
                                            <label for="remember" class="fs-12">Remember me</label>
                                        </div>
                                        <a href="#" class="fs-12 salmon-color">Forgot Password</a>
                                    </div>
                                </div>
                            </form>
                            <div class="d-flex flex-column gap-2 text-center">
                                <a href="" class="btn btn-primary w-100 rounded-1 fs-14 py-2 fw-semibold">Login</a>
                                <p class="m-0 fs-12">Don’t have an account? <a href="./Signup.html" class="salmon-color">Sign up</a>
                                </p>
                            </div>
                            <div class="middle d-flex align-items-center text-nowrap">
                                <div class="middle-line"></div>
                                <p class="m-0 fs-12 light-secondary-color px-2 text-nowrap">Or login with</p>
                                <div class="middle-line"></div>
                            </div>
                            <div class="lower d-flex flex-column gap-3">
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <a class="btn btn-primary bg-white w-100 py-3"><img
                                                src="./assets/img/Booking-detail/login-icon/facebook.svg"
                                                alt="facebook icon" width="25px" height="25px"></a>
                                    </div>
                                    <div class="col-md-4">
                                        <a class="btn btn-primary bg-white w-100 py-3"><img
                                                src="./assets/img/Booking-detail/login-icon/google.svg"
                                                alt="google icon" width="25px" height="25px"></a>
                                    </div>
                                    <div class="col-md-4">
                                        <a class="btn btn-primary bg-white w-100 py-3"><img
                                                src="./assets/img/Booking-detail/login-icon/apple.svg" alt="apple-icon"
                                                width="25px" height="25px"></a>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="col-md-6 offset-md-1">
                        <div id="carouselExampleIndicators" class="carousel slide">
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                                    class="active" aria-current="true" aria-label="Slide 1"></button>
                                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                                    aria-label="Slide 2"></button>
                                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                                    aria-label="Slide 3"></button>
                            </div>
                            <div class="carousel-inner rounded-4">
                                <div class="carousel-item active">
                                    <img src="./assets/img/login/Bali.jpg" class="d-block w-100" alt="...">
                                </div>
                                <div class="carousel-item">
                                    <img src="./assets/img/login/airplain.jpg" class="d-block w-100" alt="...">
                                </div>
                                <div class="carousel-item">
                                    <img src="./assets/img/login/hotel.jpg" class="d-block w-100"  alt="...">
                                </div>
                            </div>
                            <button class="carousel-control-prev" type="button"
                                data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <button class="carousel-control-next" type="button"
                                data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
