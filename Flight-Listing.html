<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Listing</title>
</head>
<!--google fonts-->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"

<!--my css file-->
<link rel="stylesheet" href="./assets/css/base.css">
<link rel="stylesheet" href="./assets/css/Flight-Listing.css">

<body>

  <!-- start nabvar section -->
  <nav class="navbar position-relative bg-white position-relative">
    <div class="container justify-content-between">
      <div class="reservation d-flex gap-3 ">
        <div class="flight">
          <a href="#" class="text-decoration-none">
            <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->

          <a class="find-flight text-decoration-none second-color fw-semibold" href="#">Find Flight</a>
        </div>
        <div class="stays">
          <a href="#" class="text-decoration-none">
            <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->

            </svg>
          </a>
          <a class="find-stay text-decoration-none second-color fw-semibold" href="#">Find Stays</a>
        </div>
      </div>
      <a class="navbar-brand " href="#">
        <img src="./assets/img/flights_search-page/navbar/Logo.png" alt="Logo" width="130" height="40"
          class="d-inline-block align-text-top">

      </a>
      <div class="about d-flex gap-3 align-items-center position-relative">
        <div class="love">
          <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20"
            viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
            <path fill="#0b160b"
              d="M305 151.1L320 171.8L335 151.1C360 116.5 400.2 96 442.9 96C516.4 96 576 155.6 576 229.1L576 231.7C576 343.9 436.1 474.2 363.1 529.9C350.7 539.3 335.5 544 320 544C304.5 544 289.2 539.4 276.9 529.9C203.9 474.2 64 343.9 64 231.7L64 229.1C64 155.6 123.6 96 197.1 96C239.8 96 280 116.5 305 151.1z" />
          </svg>
          <a href="#" class="fav fw-semibold second-color text-decoration-none">Favourites</a>
        </div>
        <div class="line"></div>
        <div class="ps-2 profile">
          <img src="./assets/img/listing/profile-pic.webp" alt="profile picture" class="rounded-circle">
          <a href=""><svg class="rounded-circle position-absolute bottom-0" xmlns="http://www.w3.org/2000/svg"
              height="14" width="14"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
              <path fill="#ffffff"
                d="M297.4 470.6C309.9 483.1 330.2 483.1 342.7 470.6L534.7 278.6C547.2 266.1 547.2 245.8 534.7 233.3C522.2 220.8 501.9 220.8 489.4 233.3L320 402.7L150.6 233.4C138.1 220.9 117.8 220.9 105.3 233.4C92.8 245.9 92.8 266.2 105.3 278.7L297.3 470.7z" />
            </svg></a>
          <span class="fw-semibold ">John D.</span>
        </div>
      </div>
    </div>
  </nav>
  <!-- end navbar section -->

  <main>
    <!-- start small hero section -->
    <section class="sub-hero bg-white start-50 translate-middle position-absolute">
      <div class="recording ">
        <div class="container ">
          <div class="content align-items-center gap-3 ">
            <div class="subhero-form gap-3">

              <div class="left-form gap-3 ">

                <form method="post" class="d-flex flex-column position-relative">
                  <div class="form-content"><label class="position-absolute">From-To</label>
                    <input type="text" placeholder="Lahore - Karachi">
                    <svg class="arrow position-absolute" xmlns="http://www.w3.org/2000/svg" height="20" width="20"
                      viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                      <path fill="#000000"
                        d="M566.6 470.6L470.6 566.6C461.4 575.8 447.7 578.5 435.7 573.5C423.7 568.5 416 556.9 416 544L416 480L96 480C78.3 480 64 465.7 64 448C64 430.3 78.3 416 96 416L416 416L416 352C416 339.1 423.8 327.4 435.8 322.4C447.8 317.4 461.5 320.2 470.7 329.3L566.7 425.3C579.2 437.8 579.2 458.1 566.7 470.6zM73.4 214.6C60.9 202.1 60.9 181.8 73.4 169.3L169.4 73.3C178.6 64.1 192.3 61.4 204.3 66.4C216.3 71.4 224 83.1 224 96L224 160L544 160C561.7 160 576 174.3 576 192C576 209.7 561.7 224 544 224L224 224L224 288C224 300.9 216.2 312.6 204.2 317.6C192.2 322.6 178.5 319.8 169.3 310.7L73.3 214.7z" />
                    </svg>
                  </div>
                </form>


                <form method="post" class="d-flex flex-column position-relative">
                  <div class="form-content">
                    <label class="position-absolute">Trip</label>
                    <input type="text" placeholder="Return" class="trip">
                    <svg class="arrow-drop position-absolute" xmlns="http://www.w3.org/2000/svg" height="20" width="20"
                      viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                      <path fill="#000000"
                        d="M297.4 470.6C309.9 483.1 330.2 483.1 342.7 470.6L534.7 278.6C547.2 266.1 547.2 245.8 534.7 233.3C522.2 220.8 501.9 220.8 489.4 233.3L320 402.7L150.6 233.4C138.1 220.9 117.8 220.9 105.3 233.4C92.8 245.9 92.8 266.2 105.3 278.7L297.3 470.7z" />
                    </svg>
                  </div>
                </form>
              </div>



              <div class="right-form gap-3">
                <form method="post" class="d-flex flex-column position-relative">
                  <div class="form-content">
                    <label class="position-absolute">Depart-Return</label>
                    <input type="text" placeholder="07 Nov 22 - 13 Nov 22">
                  </div>
                </form>


                <form method="post" class="d-flex flex-column position-relative">
                  <div class="form-content">
                    <label class="position-absolute">Passenger-class</label>
                    <input type="text" placeholder="1 Passenger, Economy">
                  </div>
                </form>
              </div>


            </div>
            <div class="search d-flex align-items-center">
              <a href="#" class="search-icon text-decoration-none align-items-center"><svg
                  xmlns="http://www.w3.org/2000/svg" height="24" width="24"
                  viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                  <path fill="#0b160b"
                    d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z" />
                </svg></a>
              <a href="#" class="btn-flight btn">Search</a>

            </div>
          </div>


        </div>
      </div>


    </section>
    <!-- end small hero section -->
  </main>

</body>

</html>
