<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fofgot Password</title>
    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <!--bootstrap 5.3-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--my css file-->
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/Forgot-password.css">
</head>

<body>
    <main>
        <section class="forgot-pass py-5">
            <div class="container">
                <div class="row g-3">
                    <div class="col-md-5">
                        <img src="./assets/img/flights_search-page/navbar/Logo.png" class="mb-sm-5 mb-2" alt="Logo">
                        <div class="register d-flex flex-column gap-4">
                            <div class="d-flex flex-column gap-2">
                                <div class="d-flex gap-2">
                                    <a href="./Signup.html"><svg xmlns="http://www.w3.org/2000/svg" height="20"
                                            width="20"
                                            viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                                            <path fill="#0b160b"
                                                d="M201.4 297.4C188.9 309.9 188.9 330.2 201.4 342.7L361.4 502.7C373.9 515.2 394.2 515.2 406.7 502.7C419.2 490.2 419.2 469.9 406.7 457.4L269.3 320L406.6 182.6C419.1 170.1 419.1 149.8 406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3L201.3 297.3z" />
                                        </svg></a>
                                    <a class="second-color fw-semibold" href="./Login.html">Back to login</a>
                                </div>
                                <h1 class="fw-semibold fs-1 special-font">Forgot your password?</h1>
                                <p class="light-secondary-color m-0">Don’t worry, happens to all of us. Enter your email
                                    below to recover your password</p>
                            </div>
                            <form>
                                <div class="d-flex position-relative">
                                    <label
                                        class="position-absolute bg-white p-1 fs-12 light-secondary-color">Email</label>
                                    <input type="email" placeholder="john.doe@gmail.com"
                                        class="fs-12 light-secondary-color ps-2 py-3 rounded-2 border-1 w-100">
                                </div>
                            </form>
                            <a href="" class="btn btn-primary w-100 rounded-1 fs-14 py-2 fw-semibold">Submit</a>

                            <div class="middle d-flex align-items-center text-nowrap">
                                <div class="middle-line"></div>
                                <p class="m-0 fs-12 light-secondary-color px-2 text-nowrap">Or login with</p>
                                <div class="middle-line"></div>
                            </div>
                            <div class="lower d-flex flex-column gap-3">
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <a class="btn btn-primary bg-white w-100 py-3"><img
                                                src="./assets/img/Booking-detail/login-icon/facebook.svg"
                                                alt="facebook icon" width="25px" height="25px"></a>
                                    </div>
                                    <div class="col-md-4">
                                        <a class="btn btn-primary bg-white w-100 py-3"><img
                                                src="./assets/img/Booking-detail/login-icon/google.svg"
                                                alt="google icon" width="25px" height="25px"></a>
                                    </div>
                                    <div class="col-md-4">
                                        <a class="btn btn-primary bg-white w-100 py-3"><img
                                                src="./assets/img/Booking-detail/login-icon/apple.svg" alt="apple-icon"
                                                width="25px" height="25px"></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 offset-md-1">
                        <div id="carouselExampleIndicators" class="carousel slide">
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                                    class="active" aria-current="true" aria-label="Slide 1"></button>
                                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                                    aria-label="Slide 2"></button>
                                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                                    aria-label="Slide 3"></button>
                            </div>
                            <div class="carousel-inner rounded-4">
                                <div class="carousel-item active">
                                    <img src="./assets/img/login/Bali.jpg" class="d-block w-100" alt="...">
                                </div>
                                <div class="carousel-item">
                                    <img src="./assets/img/login/airplain.jpg" class="d-block w-100" alt="...">
                                </div>
                                <div class="carousel-item">
                                    <img src="./assets/img/login/hotel.jpg" class="d-block w-100" alt="...">
                                </div>
                            </div>
                            <button class="carousel-control-prev" type="button"
                                data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <button class="carousel-control-next" type="button"
                                data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
